# Konfigurasi non-rahasia staging (spec §13.2.13/§13.2.17). Rahasia (DB_URL, REDIS_URL, RABBITMQ_URL, kunci
# vendor, AUTH_JWT_SECRET, SMTP_PASSWORD) hanya lewat ExternalSecret. Placeholder: SMTP_HOST,
# SMTP_USERNAME dan TRUSTED_PROXY_CIDRS (198.51.100.0/24 = TEST-NET-2, CIDR pod Envoy Gateway; sah agar
# Validate() lulus tetapi ditolak pins-check --prod).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kotoki-common-config
data:
  APP_ENV: staging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kotoki-api-config
data:
  MAIL_MODE: smtp
  MAIL_FROM: "Kotoki <no-reply@staging.kotoki.id>"
  SMTP_HOST: REPLACE_SMTP_HOST
  SMTP_PORT: "587"
  SMTP_USERNAME: REPLACE_SMTP_USERNAME
  CORS_ALLOWED_ORIGINS: https://app.staging.kotoki.id
  REALTIME_PUBLIC_URL: wss://realtime.staging.kotoki.id
  PASSWORD_RESET_URL_BASE: https://app.staging.kotoki.id/reset-password
  AUTH_REFRESH_COOKIE_SECURE: "true"
  AUTH_REFRESH_COOKIE_DOMAIN: ""
  TRUSTED_PROXY_CIDRS: 198.51.100.0/24
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kotoki-realtime-config
data:
  WS_ALLOWED_ORIGINS: https://app.staging.kotoki.id
  TRUSTED_PROXY_CIDRS: 198.51.100.0/24
