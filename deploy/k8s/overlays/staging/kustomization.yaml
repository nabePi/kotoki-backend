# Overlay staging (spec §13.10.8). Tanpa Secret literal: kelima Secret aplikasi berasal dari ExternalSecret
# (externalsecrets.yaml). PROVIDER_MODE=real (fake hanya untuk load test staging; prod menolak fake).
# Nilai bertanda REPLACE_* / 192.0.2.* / 198.51.100.* / digest nol adalah PLACEHOLDER MANUAL GATE yang
# ditolak `deploy/k8s/hack/pins-check.sh --prod` (Task 24).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - externalsecrets.yaml
  - rabbitmq.yaml
  - infra-recording-rules.yaml
patches:
  - path: patch-config.yaml
  # staging: topologi = prod dengan max replika lebih kecil; realtime tetap 3/20 (G4b butuh ~15 pod)
  - path: patch-scalers.yaml
  # peer data store: ipBlock TEST-NET base -> placeholder per overlay (CIDR subnet DB/Redis managed)
  - path: patch-networkpolicy.yaml
    target: {kind: NetworkPolicy, name: kotoki-api}
  - path: patch-networkpolicy.yaml
    target: {kind: NetworkPolicy, name: kotoki-realtime}
  - path: patch-networkpolicy.yaml
    target: {kind: NetworkPolicy, name: kotoki-worker}
  - path: patch-networkpolicy.yaml
    target: {kind: NetworkPolicy, name: kotoki-jobs}
  # seed spesifik lingkungan
  - target: {kind: Job, name: kotoki-seed}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: staging}
  # host dan SAN staging (§13.2.17); sertifikat wildcard butuh solver DNS-01
  - path: patch-gateway.yaml
    target: {kind: HTTPRoute, name: kotoki-api}
  - target: {kind: HTTPRoute, name: kotoki-realtime}
    patch: |-
      - {op: replace, path: /spec/hostnames/0, value: realtime.staging.kotoki.id}
  - target: {kind: Certificate, name: kotoki-edge}
    patch: |-
      - {op: replace, path: /spec/dnsNames, value: ["*.staging.kotoki.id"]}
# Tag image = git SHA; REPLACE_SHA diganti pipeline deploy-staging (Task 12). Label versi Deployment/Job di base
# juga REPLACE_SHA dan diganti pipeline yang sama.
images:
  - {name: ghcr.io/nabepi/kotoki-backend/api, newTag: REPLACE_SHA}
  - {name: ghcr.io/nabepi/kotoki-backend/realtime, newTag: REPLACE_SHA}
  - {name: ghcr.io/nabepi/kotoki-backend/worker, newTag: REPLACE_SHA}
  - {name: ghcr.io/nabepi/kotoki-backend/migrate, newTag: REPLACE_SHA}
  - {name: ghcr.io/nabepi/kotoki-backend/seed, newTag: REPLACE_SHA}
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  # PROVIDER_MODE=real dan penanda keputusan pemilik produk atas vendor aktif (provider.env berisi default
  # spec §13.2.8, bukan hasil benchmark M9). Anotasi diganti manual setelah keputusan; pins-check --prod
  # gagal selama masih REPLACE_*.
  - name: kotoki-provider-config
    namespace: kotoki
    behavior: merge
    literals:
      - PROVIDER_MODE=real
    options:
      annotations:
        kotoki.io/provider-selection: REPLACE_PRODUCT_OWNER_DECISION
