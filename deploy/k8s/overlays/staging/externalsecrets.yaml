# ExternalSecret staging (spec §13.8.4): cloud secret manager -> External Secrets Operator -> Secret ->
# envFrom.secretRef. Hanya NAMA kunci dan path remote di sini, tidak ada nilai. Least privilege per binary:
# api tanpa kunci vendor/RabbitMQ; kunci ElevenLabs/Cartesia hanya realtime; worker hanya OpenAI/DeepSeek.
# Entri remote (kotoki/staging/<binary>) harus ada di secret manager; AUTH_JWT_PREVIOUS_SECRET boleh bernilai
# kosong di luar jendela rotasi. `kotoki-keda-secrets` kunci `host` = URI amqp(s) lengkap user `keda`.
# ClusterSecretStore `kotoki-secrets` disediakan platform (di luar repo ini).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kotoki-api-secrets
  namespace: kotoki
  labels: {app.kubernetes.io/name: kotoki, app.kubernetes.io/component: secrets}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: kotoki-secrets, kind: ClusterSecretStore}
  target:
    name: kotoki-api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DB_URL
      remoteRef: {key: kotoki/staging/api, property: DB_URL}
    - secretKey: REDIS_URL
      remoteRef: {key: kotoki/staging/api, property: REDIS_URL}
    - secretKey: AUTH_JWT_SECRET
      remoteRef: {key: kotoki/staging/api, property: AUTH_JWT_SECRET}
    - secretKey: AUTH_JWT_PREVIOUS_SECRET
      remoteRef: {key: kotoki/staging/api, property: AUTH_JWT_PREVIOUS_SECRET}
    - secretKey: SMTP_PASSWORD
      remoteRef: {key: kotoki/staging/api, property: SMTP_PASSWORD}
---
