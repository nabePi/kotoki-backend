# RabbitMQ 4 satu node, HANYA untuk dev (staging/prod = RabbitmqCluster 3 node, TLS 5671). Vhost /kotoki dan
# pengguna kotoki-worker/keda/admin mengikuti docs/ops/rabbitmq.md lewat Secret rabbitmq-definitions
# (definitions.json, password dummy dev-only). Plugin rabbitmq_prometheus ikut image resmi (:15692).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: kotoki-data
  labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: kotoki-dev-deps}
spec:
  selector: {app.kubernetes.io/name: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: management, port: 15672, targetPort: management}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: kotoki-data
  labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: kotoki-dev-deps}
spec:
  replicas: 1
  serviceName: rabbitmq
  selector:
    matchLabels: {app.kubernetes.io/name: rabbitmq}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: kotoki-dev-deps}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
        fsGroup: 999
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
            - {name: rabbit-metrics, containerPort: 15692}
          env:
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: '-rabbitmq_management load_definitions "/etc/rabbitmq/definitions/definitions.json"'
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
            - {name: definitions, mountPath: /etc/rabbitmq/definitions, readOnly: true}
      volumes:
        - name: definitions
          secret: {secretName: rabbitmq-definitions}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
