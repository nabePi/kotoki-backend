# Redis 7.4 satu node, HANYA untuk dev (staging/prod = managed primary+replica, rediss://). maxmemory
# diset agar redis_memory_max_bytes ada (recording rule kotoki:redis_memory_utilization:ratio).
# Tanpa persistensi (cache/stream sesi dev boleh hilang). Sidecar exporter menghasilkan redis_up.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kotoki-data
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: kotoki-dev-deps}
spec:
  selector: {app.kubernetes.io/name: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: kotoki-data
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: kotoki-dev-deps}
spec:
  replicas: 1
  serviceName: redis
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: kotoki-dev-deps}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7.4
          command: [redis-server, --maxmemory, 256mb, --maxmemory-policy, noeviction, --appendonly, "no", --save, '""']
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
        - name: exporter
          image: oliver006/redis_exporter:v1.66.0
          ports:
            - {name: redis-metrics, containerPort: 9121}
          env:
            - {name: REDIS_ADDR, value: "redis://localhost:6379"}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: {drop: [ALL]}
