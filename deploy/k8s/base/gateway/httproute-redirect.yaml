# Listener 80 -> 301 ke https untuk semua host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kotoki-redirect
  labels: {app.kubernetes.io/name: kotoki, app.kubernetes.io/component: gateway}
spec:
  parentRefs:
    - {name: kotoki, namespace: envoy-gateway-system, sectionName: http}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
