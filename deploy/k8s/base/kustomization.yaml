apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kotoki
resources:
  - namespace.yaml
  - priorityclasses.yaml
  - configmap-common.yaml
  - api/configmap.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/pdb.yaml
  - api/scaledobject.yaml
# Tag diganti overlay (tag = git SHA; prod = digest). REPLACE_SHA sengaja tidak valid agar
# base mentah tidak pernah ter-deploy.
images:
  - name: ghcr.io/nabepi/kotoki-backend/api
    newTag: REPLACE_SHA
