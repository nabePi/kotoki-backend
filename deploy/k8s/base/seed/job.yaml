apiVersion: batch/v1
kind: Job
metadata:
  name: kotoki-seed
  labels: &labels
    app.kubernetes.io/name: kotoki
    app.kubernetes.io/component: seed
    app.kubernetes.io/version: REPLACE_SHA
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: *labels
    spec:
      restartPolicy: Never
      priorityClassName: kotoki-default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seed
          image: ghcr.io/nabepi/kotoki-backend/seed:REPLACED_BY_KUSTOMIZE
          envFrom:
            - secretRef: {name: kotoki-migrate-secrets}
          env:
            # Diganti overlay (dev/staging/prod); REPLACE_ENV tidak punya direktori seed/env sehingga base mentah tidak menyeed apa pun yang spesifik lingkungan.
            - {name: KOTOKI_ENV, value: REPLACE_ENV}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
