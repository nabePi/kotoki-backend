version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: db/queries
    gen:
      go:
        package: sqlcgen
        out: internal/postgres/sqlcgen
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          - db_type: vector
            go_type:
              import: github.com/pgvector/pgvector-go
              package: pgvector
              type: Vector
          - db_type: vector
            nullable: true
            go_type:
              import: github.com/pgvector/pgvector-go
              package: pgvector
              type: Vector
              pointer: true
